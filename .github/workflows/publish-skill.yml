name: Publish Skill

on:
  push:
    branches:
      - main
    paths:
      - "skills/cyeam-cli/**"
  workflow_dispatch:

env:
  SKILL_NAME: cyeam-cli
  SKILL_DIR: skills/cyeam-cli

jobs:
  publish:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate SKILL.md
        run: |
          if [ ! -f "${{ env.SKILL_DIR }}/SKILL.md" ]; then
            echo "Error: SKILL.md not found"
            exit 1
          fi

      - name: Create skill zip
        run: |
          cd skills
          zip -r ../${{ env.SKILL_NAME }}-skill.zip ${{ env.SKILL_NAME }}/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: skill-${{ github.run_number }}
          name: "Skill: ${{ env.SKILL_NAME }}"
          body: |
            ## Installation
            
            ```bash
            # Via skills.sh (after PR merged)
            npx skills add ${{ github.repository_owner }}/${{ env.SKILL_NAME }}
            
            # Manual installation
            curl -L https://github.com/${{ github.repository }}/releases/download/skill-${{ github.run_number }}/${{ env.SKILL_NAME }}-skill.zip | unzip -d ~/.claude/skills/
            ```
            
            ## Submit to Marketplaces
            
            ### skills.sh
            1. Fork https://github.com/vercel-labs/skills
            2. Add manifest.json to `skills/${{ github.repository_owner }}/${{ env.SKILL_NAME }}/`
            3. Create PR
            
            ### ClaudeSkills.info
            1. Fork https://github.com/anthropics/skills
            2. Copy skill files to `skills/${{ env.SKILL_NAME }}/`
            3. Create PR
            
            ### Agensi
            1. Go to https://agensi.io/creator
            2. Upload the zip file attached to this release
          files: ${{ env.SKILL_NAME }}-skill.zip

  create-pr-files:
    name: Prepare PR files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create skills.sh manifest
        run: |
          mkdir -p pr-files/skills-sh
          cat > pr-files/skills-sh/manifest.json << 'EOF'
          {
            "name": "${{ env.SKILL_NAME }}",
            "description": "Use when a user asks to use cyeam.com public site capabilities from the command line, including ask/search, date slogan or holiday lookup, Mo calligraphy/OCR, roadbook sharing, CLI version checks, or CLI self-update.",
            "repository": "https://github.com/${{ github.repository }}",
            "path": "skills/cyeam-cli",
            "agents": ["claude-code", "cursor", "codex", "gemini-cli", "windsurf"]
          }
          EOF

      - name: Create ClaudeSkills files
        run: |
          mkdir -p pr-files/claudeskills
          cp -r ${{ env.SKILL_DIR }}/* pr-files/claudeskills/

      - name: Upload PR files
        uses: actions/upload-artifact@v4
        with:
          name: pr-files-${{ github.run_number }}
          path: pr-files/

  notify:
    name: Summary
    needs: [publish, create-pr-files]
    runs-on: ubuntu-latest
    steps:
      - name: Print instructions
        run: |
          echo "========================================="
          echo "Skill Published Successfully!"
          echo "========================================="
          echo ""
          echo "Next steps:"
          echo ""
          echo "1. skills.sh (PR files ready)"
          echo "   - Fork https://github.com/vercel-labs/skills"
          echo "   - Download 'pr-files-${{ github.run_number }}' artifact"
          echo "   - Add manifest.json to skills/${{ github.repository_owner }}/${{ env.SKILL_NAME }}/"
          echo "   - Create PR"
          echo ""
          echo "2. ClaudeSkills.info"
          echo "   - Fork https://github.com/anthropics/skills"
          echo "   - Download 'pr-files-${{ github.run_number }}' artifact"
          echo "   - Copy files to skills/${{ env.SKILL_NAME }}/"
          echo "   - Create PR"
          echo ""
          echo "3. Agensi"
          echo "   - Go to https://agensi.io/creator"
          echo "   - Upload the zip from GitHub Release"
          echo ""
          echo "4. SkillsMP"
          echo "   - Already auto-indexed from GitHub!"
          echo "========================================="
