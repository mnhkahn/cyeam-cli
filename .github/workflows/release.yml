name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GOTOOLCHAIN: local

jobs:
  release:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify release tag
        shell: bash
        run: |
          tag_commit=$(git rev-parse --verify "${GITHUB_REF}^{commit}")
          event_commit=$(git rev-parse --verify "${GITHUB_SHA}^{commit}")
          if [[ "$(git rev-parse HEAD)" != "$tag_commit" || "$tag_commit" != "$event_commit" ]]; then
            echo "::error::Release tag, triggering SHA, and checkout must resolve to the same commit"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.13.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      - name: Notify Feishu
        continue-on-error: true
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo "FEISHU_WEBHOOK_URL not set, skip"
            exit 0
          fi
          go install github.com/git-chglog/git-chglog/cmd/git-chglog@v0.15.4
          CHANGELOG=$(git-chglog --template .chglog/webhook.tpl.md "${REF_NAME}" 2>/dev/null || echo "")
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${REF_NAME}"
          TEXT=$(printf '🚀 %s 发布 %s\n%s\n%s' "$REPO" "$REF_NAME" "$CHANGELOG" "$RELEASE_URL")
          PAYLOAD=$(jq -cn --arg t "$TEXT" '{msg_type:"text",content:{text:$t}}')
          curl -sf -X POST "$FEISHU_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" && echo "feishu notified" || echo "feishu notify failed"
