name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install git-chglog
        run: go install github.com/git-chglog/git-chglog/cmd/git-chglog@latest

      - name: Generate CHANGELOG.md
        run: git-chglog -o CHANGELOG.md

      - name: Commit and push CHANGELOG.md
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "no changelog changes"
          else
            git commit -m "chore: update changelog [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Move tag to latest commit
        run: |
          git tag -f "$GITHUB_REF_NAME" HEAD
          git push -f origin "$GITHUB_REF_NAME"

      - name: Delete existing release
        run: |
          gh release delete "$GITHUB_REF_NAME" --yes --cleanup-tag 2>/dev/null || true
          git tag -f "$GITHUB_REF_NAME" HEAD
          git push -f origin "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send release webhook
        continue-on-error: true
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CHANGELOG=$(git-chglog --template .chglog/webhook.tpl.md "${GITHUB_REF_NAME}" 2>/dev/null || echo "")
          curl -s -X POST "${{ secrets.RELEASE_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "$(cat <<-END
          {
            "event": "release",
            "repository": "${{ github.repository }}",
            "version": "$VERSION",
            "ref": "${{ github.ref_name }}",
            "changelog": "$CHANGELOG"
          }
          END
          )" || echo "webhook skipped (no URL configured)"