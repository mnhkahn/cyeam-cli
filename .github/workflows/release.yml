name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    env:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Feishu release success
        if: success() && env.FEISHU_WEBHOOK_URL != ''
        run: |
          curl -fsS -X POST "$FEISHU_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(cat <<EOF
          {
            "msg_type": "text",
            "content": {
              "text": "cyeam CLI Release succeeded: ${GITHUB_REF_NAME}\n${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
            }
          }
          EOF
          )"

      - name: Notify Feishu release failure
        if: failure() && env.FEISHU_WEBHOOK_URL != ''
        run: |
          curl -fsS -X POST "$FEISHU_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(cat <<EOF
          {
            "msg_type": "text",
            "content": {
              "text": "cyeam CLI Release failed: ${GITHUB_REF_NAME}\n${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            }
          }
          EOF
          )"
