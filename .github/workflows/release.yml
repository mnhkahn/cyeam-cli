name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install git-chglog
        run: go install github.com/git-chglog/git-chglog/cmd/git-chglog@latest

      - name: Generate CHANGELOG.md
        run: git-chglog -o CHANGELOG.md

      - name: Commit and push CHANGELOG.md
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "no changelog changes"
          else
            git commit -m "chore: update changelog [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Move tag to latest commit
        run: |
          git tag -f "$GITHUB_REF_NAME" HEAD
          git push -f origin "$GITHUB_REF_NAME"

      - name: Delete existing release
        run: |
          gh release delete "$GITHUB_REF_NAME" --yes --cleanup-tag 2>/dev/null || true
          git tag -f "$GITHUB_REF_NAME" HEAD
          git push -f origin "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Feishu
        continue-on-error: true
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo "FEISHU_WEBHOOK_URL not set, skip"
            exit 0
          fi
          CHANGELOG=$(git-chglog --template .chglog/webhook.tpl.md "${REF_NAME}" 2>/dev/null || echo "")
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${REF_NAME}"
          TEXT=$(printf '🚀 %s 发布 %s\n%s\n%s' "$REPO" "$REF_NAME" "$CHANGELOG" "$RELEASE_URL")
          PAYLOAD=$(jq -cn --arg t "$TEXT" '{msg_type:"text",content:{text:$t}}')
          curl -sf -X POST "$FEISHU_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" && echo "feishu notified" || echo "feishu notify failed"
